<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Tracker - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Login Section -->
    <div id="login-section" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Admin Portal</h1>
                <p class="text-gray-500 text-sm mt-1">Employee Tracker System</p>
            </div>
            
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter admin">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter admin">
                </div>
                <div id="error-msg" class="text-red-500 text-sm hidden text-center">Invalid Username or Password!</div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
                    Login to Panel
                </button>
            </form>
            <div class="mt-4 text-center text-xs text-gray-400">
                Default: username: <b>admin</b> | password: <b>admin</b>
            </div>
        </div>
    </div>

    <!-- Dashboard Section (Hidden by Default) -->
    <div id="dashboard-section" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <span class="text-xl font-bold text-gray-800">EmpTrack <span class="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded">Admin</span></span>
            </div>
            <button onclick="handleLogout()" class="text-red-500 hover:text-red-700 font-medium text-sm flex items-center space-x-1">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <!-- Stats Row -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Employees</p>
                        <h3 id="total-emp" class="text-2xl font-bold text-gray-800 mt-1">3</h3>
                    </div>
                    <div class="bg-blue-50 text-blue-600 p-4 rounded-xl text-xl">
                        <i class="fa-solid fa-users"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Active Now</p>
                        <h3 id="active-emp" class="text-2xl font-bold text-green-600 mt-1">2</h3>
                    </div>
                    <div class="bg-green-50 text-green-600 p-4 rounded-xl text-xl">
                        <i class="fa-solid fa-user-check"></i>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">On Leave / Offline</p>
                        <h3 id="offline-emp" class="text-2xl font-bold text-orange-500 mt-1">1</h3>
                    </div>
                    <div class="bg-orange-50 text-orange-500 p-4 rounded-xl text-xl">
                        <i class="fa-solid fa-user-clock"></i>
                    </div>
                </div>
            </div>

            <!-- Employee Table Section -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="p-5 border-b flex justify-between items-center">
                    <h2 class="text-lg font-bold text-gray-800">Employee Directory & Status</h2>
                    <span class="text-xs text-gray-500">Real-time Tracker</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
                                <th class="py-3 px-6">Name</th>
                                <th class="py-3 px-6">Role</th>
                                <th class="py-3 px-6">Status</th>
                                <th class="py-3 px-6">Last Active</th>
                                <th class="py-3 px-6">Action</th>
                            </tr>
                        </thead>
                        <tbody id="employee-table-body" class="divide-y divide-gray-200 text-sm text-gray-700">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const employees = [
            { id: 1, name: "Aman Sharma", role: "Frontend Developer", status: "Active", time: "Just now" },
            { id: 2, name: "Priya Verma", role: "UI/UX Designer", status: "Active", time: "5 mins ago" },
            { id: 3, name: "Rahul Singh", role: "Backend Developer", status: "Offline", time: "2 hours ago" }
        ];

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (user === "admin" && pass === "admin") {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                loadEmployees();
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('login-form').reset();
            document.getElementById('error-msg').classList.add('hidden');
        }

        function loadEmployees() {
            const tbody = document.getElementById('employee-table-body');
            tbody.innerHTML = "";
            
            employees.forEach(emp => {
                const statusBadge = emp.status === "Active" 
                    ? '<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-medium">Active</span>' 
                    : '<span class="bg-orange-100 text-orange-700 px-2.5 py-1 rounded-full text-xs font-medium">Offline</span>';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="py-4 px-6 font-medium text-gray-900">${emp.name}</td>
                        <td class="py-4 px-6">${emp.role}</td>
                        <td class="py-4 px-6">${statusBadge}</td>
                        <td class="py-4 px-6 text-gray-500">${emp.time}</td>
                        <td class="py-4 px-6">
                            <button onclick="alert('Viewing activity log for ${emp.name}')" class="text-blue-600 hover:underline font-medium text-xs">View Log</button>
                        </td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
